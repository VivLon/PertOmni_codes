[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pertomni"
version = "0.1.0"
description = "PertOmni: contrastive alignment of chemical and genetic perturbation responses with LLM text embeddings"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "lightning>=2.1",
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "anndata",
    "scanpy",
    "h5py",
    "pyarrow",
]

[project.optional-dependencies]
# text embeddings and pathway assignment (scripts/preprocessing/make_text_inputs.py)
preprocessing = ["openai", "gseapy"]
dev = ["ruff"]

[tool.setuptools.packages.find]
include = ["pertomni*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "E731"]
